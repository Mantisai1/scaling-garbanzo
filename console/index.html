<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mantis Console</title>
<style>
  :root{--bg:#0f1115;--panel:#171a21;--line:#262b36;--fg:#e6e8ee;--mut:#8b93a7;--acc:#4f8cff;--ok:#34c38f;--bad:#f0616d;--warn:#f5b942;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-size:14px}
  header{display:flex;align-items:center;gap:16px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:2}
  header b{font-size:16px;letter-spacing:.3px}header input{background:#0c0e12;border:1px solid var(--line);color:var(--fg);padding:6px 10px;border-radius:6px;width:380px;font-family:ui-monospace,monospace}
  nav{display:flex;gap:4px;flex-wrap:wrap}nav button{background:transparent;border:1px solid transparent;color:var(--mut);padding:6px 10px;border-radius:6px;cursor:pointer}
  nav button.on{color:var(--fg);border-color:var(--line);background:#1f2430}
  main{padding:18px;display:grid;gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
  h2{margin:0 0 10px;font-size:15px}h3{margin:14px 0 6px;font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
  table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mut);font-weight:500;font-size:12px}
  tr.click:hover{background:#1d2230;cursor:pointer}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;border:1px solid var(--line);color:var(--mut)}
  .ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}.mut{color:var(--mut)}.mono{font-family:ui-monospace,monospace;font-size:12px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.kpi{background:#0c0e12;border:1px solid var(--line);border-radius:8px;padding:10px}.kpi b{display:block;font-size:20px;margin-top:4px}
  .tree .row{display:grid;grid-template-columns:minmax(220px,1fr) 3fr 120px;gap:8px;align-items:center;padding:4px 0;border-bottom:1px solid #1c2029}
  .bar{height:10px;border-radius:3px;background:var(--acc);opacity:.85;position:relative}.bar.tool_call{background:var(--warn)}.bar.llm_generation{background:var(--ok)}.bar.planner_step{background:#9a7bff}.bar.retrieval{background:#3dc6e0}
  .barwrap{position:relative;height:10px;background:#0c0e12;border-radius:3px}.bar{position:absolute;top:0}
  pre{background:#0c0e12;border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;max-height:300px;font-size:12px;margin:6px 0}
  button.act{background:var(--acc);color:#fff;border:0;padding:6px 12px;border-radius:6px;cursor:pointer}button.act.ghost{background:#262b36}button.act:disabled{opacity:.4}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:900px){.grid2{grid-template-columns:1fr}}
  textarea{width:100%;background:#0c0e12;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px;font-family:ui-monospace,monospace;font-size:12px}
  .flow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.flow span{padding:4px 10px;border:1px solid var(--line);border-radius:6px;background:#0c0e12}.flow i{color:var(--mut)}
  .empty{color:var(--mut);padding:20px;text-align:center}a{color:var(--acc)}
</style>
</head>
<body>
<header>
  <b>Mantis</b>
  <input id="key" placeholder="paste an API key (viewer or higher)" />
  <select id="proj" style="background:#0c0e12;color:var(--fg);border:1px solid var(--line);padding:6px;border-radius:6px;display:none"></select>
  <nav id="nav"></nav>
  <span id="who" class="mut mono"></span>
</header>
<main id="main"></main>
<script>
const $=s=>document.querySelector(s);const VIEWS=["Overview","Traces","Evaluations","Annotations","Learning","Releases","Audit"];
let view=localStorage.getItem("mantis.view")||"Overview";let key=localStorage.getItem("mantis.key")||"";$("#key").value=key;
$("#key").addEventListener("change",e=>{key=e.target.value.trim();localStorage.setItem("mantis.key",key);render()});
let proj=localStorage.getItem("mantis.proj")||"";$("#proj").addEventListener("change",e=>{proj=e.target.value;localStorage.setItem("mantis.proj",proj);render()});
async function loadProjects(){try{const ps=await fetch("/v1/admin/projects",{headers:{"X-API-Key":key}}).then(r=>r.json());if(!Array.isArray(ps))return;const sel=$("#proj");sel.style.display=ps.length>1?"":"none";if(!ps.find(p=>p.id===proj))proj=ps[0]?.id||"";sel.innerHTML=ps.map(p=>`<option value="${p.id}" ${p.id===proj?"selected":""}>${esc(p.name)}</option>`).join("");$("#who").textContent=ps.length?"project: "+(ps.find(p=>p.id===proj)||{}).name:""}catch(e){}}
async function api(path,opt={}){if(proj){path+=(path.includes("?")?"&":"?")+"project_id="+proj;if(opt.body&&!opt.body.project_id)opt.body={...opt.body,project_id:proj}}
  const r=await fetch(path,{...opt,headers:{"X-API-Key":key,"Content-Type":"application/json",...(opt.headers||{})},body:opt.body?JSON.stringify(opt.body):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.detail||r.statusText);return j}
const esc=s=>String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));const pct=v=>v==null?"–":(v*100).toFixed(0)+"%";const money=v=>"$"+(v||0).toFixed(4);const ago=iso=>{const d=(Date.now()-new Date(iso))/1000;return d<60?`${d|0}s ago`:d<3600?`${d/60|0}m ago`:d<86400?`${d/3600|0}h ago`:`${d/86400|0}d ago`};
function nav(){$("#nav").innerHTML=VIEWS.map(v=>`<button class="${v===view?'on':''}" onclick="go('${v}')">${v}</button>`).join("")}
function go(v){view=v;localStorage.setItem("mantis.view",v);render()}
async function render(){nav();const m=$("#main");if(!key){m.innerHTML=`<div class="card empty">Paste an API key above. Run <span class="mono">make demo</span> to get one.</div>`;return}
  try{m.innerHTML=`<div class="card empty">Loading…</div>`;await loadProjects();await ({Overview,Traces,Evaluations,Annotations,Learning,Releases,Audit})[view](m)}catch(e){m.innerHTML=`<div class="card bad">${esc(e.message)}</div>`}}

async function Overview(m){const [tr,bm,runs,rel,ann]=await Promise.all([api("/v1/traces?limit=200"),api("/v1/analytics/breakdown?by=model"),api("/v1/eval-runs"),api("/v1/releases"),api("/v1/annotations")]);
  const cost=tr.reduce((a,t)=>a+t.cost_usd,0),errs=tr.filter(t=>t.has_error).length,active=rel.find(r=>r.active);
  m.innerHTML=`<div class="card"><h2>The loop</h2><div class="flow"><span>Observe<br><b>${tr.length}</b> traces</span><i>→</i><span>Evaluate<br><b>${runs.length}</b> runs</span><i>→</i><span>Label<br><b>${ann.filter(a=>a.status==="approved").length}/${ann.length}</b> approved</span><i>→</i><span>Improve<br><b>${(await api("/v1/training-jobs")).length}</b> jobs</span><i>→</i><span>Validate<br><b>${(await api("/v1/candidates")).filter(c=>c.status.startsWith("gated")||c.status==="promoted").length}</b> gated</span><i>→</i><span>Deploy<br><b>${active?active.agent_version:"none"}</b></span></div></div>
  <div class="kpis"><div class="kpi">Traces (last 200)<b>${tr.length}</b></div><div class="kpi">Spend<b>${money(cost)}</b></div><div class="kpi">Traces with errors<b class="${errs?'bad':'ok'}">${errs}</b></div><div class="kpi">Active release<b>${active?esc(active.environment)+" · "+esc(active.model):"–"}</b></div></div>
  <div class="card"><h2>Cost / latency / errors by model</h2><table><tr><th>model</th><th>spans</th><th>avg latency</th><th>cost</th><th>error rate</th></tr>${bm.map(r=>`<tr><td class="mono">${esc(r.model||"–")}</td><td>${r.spans}</td><td>${r.avg_latency_ms} ms</td><td>${money(r.cost_usd)}</td><td class="${r.error_rate?'bad':'ok'}">${pct(r.error_rate)}</td></tr>`).join("")}</table></div>`}

async function Traces(m,filter=""){const tr=await api("/v1/traces?limit=100"+filter);
  m.innerHTML=`<div class="card"><h2>Traces</h2><div style="margin-bottom:8px" class="flow"><input id="q" placeholder="filter: session_id=… user_ref=… model=… status=ERROR" style="width:420px;background:#0c0e12;border:1px solid var(--line);color:var(--fg);padding:6px 10px;border-radius:6px" value="${esc(filter.replace(/^&/,'').replace(/&/g,' '))}"><button class="act ghost" onclick="Traces($('#main'),'&'+$('#q').value.trim().split(/\\s+/).filter(Boolean).join('&'))">Apply</button></div>
  <table><tr><th>when</th><th>name</th><th>session / user</th><th>release</th><th>spans</th><th>latency</th><th>tokens</th><th>cost</th><th></th></tr>${tr.map(t=>`<tr class="click" onclick="Trace('${t.trace_id}')"><td class="mut">${ago(new Date(t.start_ns/1e6).toISOString())}</td><td>${esc(t.name)}</td><td class="mono mut">${esc(t.session_id||"")} ${esc(t.user_ref||"")}</td><td class="mono">${esc(t.release||"")}</td><td>${t.span_count}</td><td>${t.duration_ms} ms</td><td>${t.input_tokens}/${t.output_tokens}</td><td>${money(t.cost_usd)}</td><td>${t.has_error?'<span class="bad">●</span>':'<span class="ok">●</span>'}</td></tr>`).join("")||'<tr><td colspan=9 class="empty">No traces yet.</td></tr>'}</table></div><div id="detail"></div>`}
async function Trace(id){const t=await api("/v1/traces/"+id);const t0=Math.min(...t.spans.map(s=>s.start_ns)),span=Math.max(1,Math.max(...t.spans.map(s=>s.end_ns))-t0);
  const depth={};t.spans.forEach(s=>{depth[s.span_id]=s.parent_span_id&&depth[s.parent_span_id]!=null?depth[s.parent_span_id]+1:0});
  $("#detail").innerHTML=`<div class="card"><h2>Trace <span class="mono mut">${id}</span></h2><div class="kpis"><div class="kpi">Duration<b>${t.totals.duration_ms} ms</b></div><div class="kpi">Tokens<b>${t.totals.input_tokens} / ${t.totals.output_tokens}</b></div><div class="kpi">Cost<b>${money(t.totals.cost_usd)}</b></div><div class="kpi">Redactions<b>${t.spans.reduce((a,s)=>a+s.redactions_applied,0)}</b></div></div>
  <h3>Span tree</h3><div class="tree">${t.spans.map(s=>`<div class="row"><div style="padding-left:${depth[s.span_id]*16}px"><span class="pill">${s.kind}</span> ${esc(s.name)} ${s.status==="ERROR"?'<span class="bad">✕</span>':''}</div><div class="barwrap"><div class="bar ${s.kind}" style="left:${(s.start_ns-t0)/span*100}%;width:${Math.max(.5,(s.end_ns-s.start_ns)/span*100)}%"></div></div><div class="mut mono">${s.duration_ms} ms</div></div>`).join("")}</div>
  ${t.scores.length?`<h3>Scores</h3><table><tr><th>name</th><th>value</th><th>source</th><th>evaluator</th><th>comment</th></tr>${t.scores.map(s=>`<tr><td>${esc(s.name)}</td><td class="${s.value>=1?'ok':s.value>0?'warn':'bad'}">${s.value}</td><td>${s.source}</td><td class="mono mut">${esc(s.evaluator_version)}</td><td class="mut">${esc(s.comment||"")}</td></tr>`).join("")}</table>`:""}
  <h3>Spans (raw attributes, post-redaction)</h3>${t.spans.map(s=>`<details><summary>${esc(s.name)} <span class="mut">${s.provider||""} ${s.model||""}</span></summary><pre>${esc(JSON.stringify({attributes:s.attributes,events:s.events},null,2))}</pre></details>`).join("")}
  <div style="margin-top:10px" class="flow"><button class="act ghost" onclick="api('/v1/traces/${id}/export').then(d=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)]));a.download='trace-${id}.json';a.click()}).catch(e=>alert(e.message))">Export (audited)</button><button class="act ghost" onclick="api('/v1/annotations/queue',{method:'POST',body:{trace_ids:['${id}']}}).then(()=>go('Annotations')).catch(e=>alert(e.message))">Send to review queue</button></div></div>`;$("#detail").scrollIntoView({behavior:"smooth"})}

async function Evaluations(m){const [runs,ds,cfgs]=await Promise.all([api("/v1/eval-runs"),api("/v1/datasets"),api("/v1/agent-configs")]);const cfg=Object.fromEntries(cfgs.map(c=>[c.id,c]));
  m.innerHTML=`<div class="grid2"><div class="card"><h2>Datasets</h2><table><tr><th>name</th><th>kind</th><th>versions</th></tr>${ds.map(d=>`<tr><td>${esc(d.name)}</td><td><span class="pill">${d.kind}</span></td><td class="mono mut">${d.versions.map(v=>`v${v.version} · ${v.items} items · ${v.hash}`).join("<br>")}</td></tr>`).join("")}</table></div>
  <div class="card"><h2>Agent configs</h2><table><tr><th>name</th><th>version</th><th>model</th><th>prompt</th><th>checkpoint</th></tr>${cfgs.map(c=>`<tr><td>${esc(c.name)}</td><td class="mono">${esc(c.version)}</td><td class="mono">${esc(c.model)}</td><td class="mono">${esc(c.prompt_version)}</td><td class="mono mut">${c.checkpoint_id?c.checkpoint_id.slice(0,8):"–"}</td></tr>`).join("")}</table></div></div>
  <div class="card"><h2>Evaluation runs</h2><table><tr><th>when</th><th>agent</th><th>status</th><th>summary</th><th></th></tr>${runs.map(r=>`<tr class="click" onclick="Run('${r.id}')"><td class="mut">${ago(r.created_at)}</td><td class="mono">${esc(cfg[r.agent_config_id]?.version||r.agent_config_id)}</td><td>${r.status}</td><td>${Object.entries(r.summary).filter(([k])=>k!=="_items").map(([k,v])=>`<span class="pill">${k} <b class="${v>=.9?'ok':v>=.5?'warn':'bad'}">${pct(v)}</b></span>`).join(" ")}</td><td class="mono mut">${r.id.slice(0,8)}</td></tr>`).join("")||'<tr><td colspan=5 class="empty">No runs yet.</td></tr>'}</table></div><div id="detail"></div>`}
async function Run(id){const r=await api("/v1/eval-runs/"+id);const runs=await api("/v1/eval-runs");const others=runs.filter(x=>x.id!==id&&x.dataset_version_id===r.pinned.dataset_version_id);
  $("#detail").innerHTML=`<div class="card"><h2>Run <span class="mono mut">${id}</span></h2><div class="mono mut">pinned: dataset ${r.pinned.dataset_hash.slice(0,12)} · agent ${esc(r.pinned.agent_config.version)} · model ${esc(r.pinned.agent_config.model)} · prompt ${esc(r.pinned.agent_config.prompt_version)} · evaluator ${esc(r.pinned.evaluator_version)} · env ${esc(r.pinned.environment_image)}</div>
  ${others.length?`<div style="margin:10px 0" class="flow">Compare against baseline: <select id="base" style="background:#0c0e12;color:var(--fg);border:1px solid var(--line);padding:5px;border-radius:6px">${others.map(o=>`<option value="${o.id}">${o.id.slice(0,8)} · ${ago(o.created_at)}</option>`).join("")}</select><button class="act ghost" onclick="Compare('${id}',$('#base').value)">Compare</button></div><div id="cmp"></div>`:""}
  <table><tr><th>task</th><th>input</th><th>output</th><th>tools</th><th>scores</th><th>trace</th></tr>${r.results.map(x=>`<tr><td class="mono">${esc(x.task_id)}</td><td class="mut">${esc(JSON.stringify(x.input))}</td><td>${esc(x.output)}</td><td class="mono mut">${x.tool_calls.map(t=>t.name).join(", ")}</td><td>${x.scores.map(s=>`<span class="pill" title="${esc(s.comment||"")}">${s.name} <b class="${s.value>=1?'ok':s.value>0?'warn':'bad'}">${s.value}</b></span>`).join(" ")}</td><td>${x.trace_id?`<a href="#" class="mono" onclick="go('Traces');setTimeout(()=>Trace('${x.trace_id}'),300);return false">${x.trace_id.slice(0,8)}</a>`:""}</td></tr>`).join("")}</table>
  <div style="margin-top:10px"><button class="act ghost" onclick="api('/v1/annotations/queue',{method:'POST',body:{eval_run_id:'${id}',only_failures_below:1}}).then(j=>{alert(j.queued.length+' items queued');go('Annotations')}).catch(e=>alert(e.message))">Queue failures for review</button></div></div>`;$("#detail").scrollIntoView({behavior:"smooth"})}
async function Compare(a,b){const c=await api(`/v1/eval-runs/${a}/compare/${b}`);$("#cmp").innerHTML=`<table><tr><th>metric</th><th>candidate</th><th>baseline</th><th>delta</th></tr>${c.metrics.map(m=>`<tr><td>${m.name}</td><td>${pct(m.candidate)}</td><td>${pct(m.baseline)}</td><td class="${m.delta>0?'ok':m.delta<0?'bad':'mut'}">${m.delta>0?"+":""}${(m.delta*100).toFixed(1)} pts</td></tr>`).join("")}</table>`}

async function Annotations(m){const anns=await api("/v1/annotations");const by=s=>anns.filter(a=>a.status===s);
  const row=a=>`<tr><td class="mono mut">${a.id.slice(0,8)}</td><td><span class="pill">${a.status}</span></td><td class="mut">${esc(JSON.stringify(a.input).slice(0,140))}</td><td>${esc(JSON.stringify(a.output).slice(0,140))}</td><td>${a.signal_type?`<span class="pill">${a.signal_type}</span> ${esc(JSON.stringify(a.label).slice(0,120))}`:""}</td><td>${a.status==="queued"?`<button class="act ghost" onclick="Annotate('${a.id}')">Annotate</button>`:a.status==="annotated"?`<button class="act" onclick="api('/v1/annotations/${a.id}/approve',{method:'POST'}).then(render).catch(e=>alert(e.message))">Approve</button> <button class="act ghost" onclick="api('/v1/annotations/${a.id}/reject',{method:'POST'}).then(render).catch(e=>alert(e.message))">Reject</button>`:""}</td></tr>`;
  m.innerHTML=`<div class="kpis"><div class="kpi">Queued<b>${by("queued").length}</b></div><div class="kpi">Awaiting approval<b>${by("annotated").length}</b></div><div class="kpi">Approved → signals<b class="ok">${by("approved").length}</b></div><div class="kpi">Rejected<b>${by("rejected").length}</b></div></div>
  <div class="card"><h2>Review queue</h2><p class="mut">Reviewers annotate. A <b>data_approver</b> (a different identity) approves; approval is the only way a training signal is created.</p><table><tr><th>id</th><th>status</th><th>input</th><th>output</th><th>label</th><th></th></tr>${anns.map(row).join("")||'<tr><td colspan=6 class="empty">Queue is empty.</td></tr>'}</table>
  <div style="margin-top:10px" class="flow"><button class="act" ${by("approved").length?"":"disabled"} onclick="api('/v1/training-datasets',{method:'POST',body:{name:'approved-signals'}}).then(j=>{alert('Training dataset v'+j.version+' · '+j.records+' records · '+j.hash.slice(0,12));go('Learning')}).catch(e=>alert(e.message))">Snapshot approved signals → training dataset</button></div></div><div id="detail"></div>`}
function Annotate(id){$("#detail").innerHTML=`<div class="card"><h2>Annotate <span class="mono mut">${id.slice(0,8)}</span></h2><div class="flow">Signal type <select id="st" style="background:#0c0e12;color:var(--fg);border:1px solid var(--line);padding:5px;border-radius:6px"><option>corrected_output</option><option>outcome_label</option><option>preference_pair</option><option>tool_quality</option><option>incident</option></select></div><textarea id="lbl" rows=6>{"correct": false, "corrected_output": "", "notes": ""}</textarea><div style="margin-top:8px"><button class="act" onclick="api('/v1/annotations/${id}/annotate',{method:'POST',body:{signal_type:$('#st').value,label:JSON.parse($('#lbl').value)}}).then(render).catch(e=>alert(e.message))">Submit</button></div></div>`;$("#detail").scrollIntoView({behavior:"smooth"})}

async function Learning(m){const [jobs,cands,ds,cfgs,pols,runs]=await Promise.all([api("/v1/training-jobs"),api("/v1/candidates"),api("/v1/datasets"),api("/v1/agent-configs"),api("/v1/promotion-policies"),api("/v1/eval-runs")]);
  const train=ds.filter(d=>d.kind==="training").flatMap(d=>d.versions.map(v=>({...v,name:d.name})));const base=cfgs.filter(c=>!c.checkpoint_id);
  const sel=(id,opts)=>`<select id="${id}" style="background:#0c0e12;color:var(--fg);border:1px solid var(--line);padding:5px;border-radius:6px">${opts}</select>`;
  m.innerHTML=`<div class="card"><h2>Launch training job</h2><div class="flow">dataset ${sel("tdv",train.map(v=>`<option value="${v.id}">${esc(v.name)} v${v.version} · ${v.items} rec</option>`).join(""))} base ${sel("bcfg",base.map(c=>`<option value="${c.id}">${esc(c.name)} ${esc(c.version)}</option>`).join(""))} adapter ${sel("ad",`<option>local_stub</option><option>openai_finetune</option>`)} method ${sel("me",`<option>sft</option><option>preference</option>`)}<button class="act" ${train.length&&base.length?"":"disabled"} onclick="api('/v1/training-jobs',{method:'POST',body:{training_dataset_version_id:$('#tdv').value,base_agent_config_id:$('#bcfg').value,adapter:$('#ad').value,method:$('#me').value}}).then(j=>{alert(j.status+'\\n'+j.log.join('\\n'));render()}).catch(e=>alert(e.message))">Launch</button></div></div>
  <div class="grid2"><div class="card"><h2>Training jobs</h2><table><tr><th>when</th><th>adapter</th><th>method</th><th>status</th><th>log</th></tr>${jobs.map(j=>`<tr><td class="mut">${ago(j.created_at)}</td><td>${j.adapter}</td><td>${j.method}</td><td class="${j.status==="succeeded"?'ok':j.status==="failed"?'bad':'warn'}">${j.status}</td><td class="mono mut">${j.log.map(esc).join("<br>")}</td></tr>`).join("")||'<tr><td colspan=5 class="empty">None yet.</td></tr>'}</table></div>
  <div class="card"><h2>Promotion policy</h2>${pols.length?`<div class="mono mut">v${pols.at(-1).version}</div><pre>${esc(JSON.stringify(pols.at(-1).rules,null,2))}</pre>`:'<p class="mut">No policy yet. Candidates cannot be gated until one exists.</p>'}<textarea id="pol" rows=5>${esc(JSON.stringify(pols.at(-1)?.rules||{required_metrics:[{name:"contains",min:0.75,min_delta_vs_baseline:0.1},{name:"tool_call_assert",min:1}],critical_checks:["no_pii_leak"],required_approver_role:"release_approver"},null,1))}</textarea><div style="margin-top:6px"><button class="act ghost" onclick="api('/v1/promotion-policies',{method:'POST',body:{rules:JSON.parse($('#pol').value)}}).then(render).catch(e=>alert(e.message))">Publish new policy version</button></div></div></div>
  <div class="card"><h2>Candidates</h2><table><tr><th>when</th><th>agent version</th><th>model</th><th>status</th><th>gate</th><th>actions</th></tr>${cands.map(c=>{const cr=runs.filter(r=>r.agent_config_id===c.agent_config_id),br=runs.filter(r=>r.agent_config_id!==c.agent_config_id);return`<tr><td class="mut">${ago(c.created_at)}</td><td class="mono">${esc(c.agent_version)}</td><td class="mono">${esc(c.model)}</td><td><span class="pill ${c.status==="gated_pass"||c.status==="promoted"?'ok':c.status==="gated_fail"?'bad':''}">${c.status}</span></td><td>${c.gate_result.checks?c.gate_result.checks.map(k=>`<div class="${k.ok?'ok':'bad'} mono">${k.ok?"✓":"✕"} ${esc(k.metric||k.critical_check)} ${k.value??"–"}${k.min!=null?" ≥ "+k.min:""}${k.delta!=null?" Δ"+k.delta:""}</div>`).join(""):'<span class="mut">not gated</span>'}</td><td class="flow">
    <button class="act ghost" onclick="Evaluate('${c.agent_config_id}')">Evaluate</button>
    ${cr.length?`${sel("cr"+c.id,cr.map(r=>`<option value="${r.id}">run ${r.id.slice(0,6)}</option>`).join(""))} vs ${sel("br"+c.id,`<option value="">(no baseline)</option>`+br.map(r=>`<option value="${r.id}">run ${r.id.slice(0,6)}</option>`).join(""))}<button class="act ghost" onclick="api('/v1/candidates/${c.id}/gate',{method:'POST',body:{eval_run_id:$('#cr${c.id}').value,baseline_eval_run_id:$('#br${c.id}').value||null}}).then(render).catch(e=>alert(e.message))">Gate</button>`:""}
    ${c.status==="gated_pass"?`<button class="act" onclick="Promote('${c.id}')">Promote…</button>`:""}</td></tr>`}).join("")||'<tr><td colspan=6 class="empty">No candidates. Launch a training job.</td></tr>'}</table></div>`}
async function Evaluate(cfgId){const [ds,runs]=await Promise.all([api("/v1/datasets"),api("/v1/eval-runs")]);const ev=ds.filter(d=>d.kind==="eval").flatMap(d=>d.versions.map(v=>({...v,name:d.name})));const last=runs[0];const dv=prompt("Eval dataset version id:\n"+ev.map(v=>`${v.id}  ${v.name} v${v.version}`).join("\n"),last?last.dataset_version_id:ev[0]?.id);if(!dv)return;
  const scorers=last?(await api("/v1/eval-runs/"+last.id)).scorers:[{type:"contains"},{type:"tool_call_assert"},{type:"no_pii_leak"},{type:"llm_judge"}];
  api("/v1/eval-runs",{method:"POST",body:{dataset_version_id:dv,agent_config_id:cfgId,scorers}}).then(j=>{alert("Run complete: "+JSON.stringify(j.summary));render()}).catch(e=>alert(e.message))}
async function Promote(cid){const pr=await api("/v1/admin/projects");const envs=(pr.find(p=>p.id===proj)||pr[0]).environments;const name=prompt("Environment: "+envs.map(e=>e.name).join(" / "),"prod");const env=envs.find(e=>e.name===name);if(!env)return;api(`/v1/candidates/${cid}/promote`,{method:"POST",body:{environment_id:env.id}}).then(j=>{alert("Released "+j.release_id.slice(0,8)+" to "+j.environment);go("Releases")}).catch(e=>alert(e.message))}

async function Releases(m){const rel=await api("/v1/releases");
  m.innerHTML=`<div class="card"><h2>Release registry</h2><table><tr><th>when</th><th>env</th><th>agent version</th><th>model</th><th>active</th><th>approved by</th><th>policy</th><th></th></tr>${rel.map(r=>`<tr><td class="mut">${ago(r.created_at)}</td><td><span class="pill">${esc(r.environment)}</span></td><td class="mono">${esc(r.agent_version)}</td><td class="mono">${esc(r.model)}</td><td>${r.active?'<span class="ok">● active</span>':'<span class="mut">inactive</span>'}</td><td class="mono mut">${r.approved_by.slice(0,8)}</td><td class="mono mut">${r.policy_id.slice(0,8)}</td><td class="flow"><button class="act ghost" onclick="Lineage('${r.id}')">Lineage</button>${r.active?`<button class="act ghost" onclick="if(confirm('Roll back this release?'))api('/v1/releases/${r.id}/rollback',{method:'POST'}).then(render).catch(e=>alert(e.message))">Rollback</button>`:""}</td></tr>`).join("")||'<tr><td colspan=8 class="empty">Nothing released yet.</td></tr>'}</table></div><div id="detail"></div>`}
async function Lineage(id){const l=await api(`/v1/releases/${id}/lineage`);
  $("#detail").innerHTML=`<div class="card"><h2>Lineage for release <span class="mono mut">${id.slice(0,8)}</span></h2><div class="flow"><span>Release<br><span class="mono mut">${id.slice(0,8)}</span></span><i>←</i><span>Candidate<br><span class="mono mut">${l.candidate.id.slice(0,8)}</span></span><i>←</i><span>Checkpoint<br><span class="mono mut">${l.checkpoint?l.checkpoint.hash.slice(0,12):"–"}</span></span><i>←</i><span>Training job<br><span class="mono mut">${l.training_job?l.training_job.adapter+"/"+l.training_job.method:"–"}</span></span><i>←</i><span>Training dataset<br><span class="mono mut">${l.training_dataset_version?"v"+l.training_dataset_version.version+" · "+l.training_dataset_version.records+" rec":"–"}</span></span><i>←</i><span>Signals<br><b>${l.training_signals.length}</b></span><i>←</i><span>Annotations<br><b>${l.annotations.length}</b></span><i>←</i><span>Source traces<br><b>${l.source_trace_ids.length}</b></span></div>
  <h3>Gate decision (policy ${l.release.policy_id.slice(0,8)})</h3><pre>${esc(JSON.stringify(l.candidate.gate_result,null,2))}</pre>
  <h3>Source traces</h3><div class="flow">${l.source_trace_ids.map(t=>`<a href="#" class="mono" onclick="go('Traces');setTimeout(()=>Trace('${t}'),300);return false">${t.slice(0,12)}</a>`).join("")}</div></div>`;$("#detail").scrollIntoView({behavior:"smooth"})}

async function Audit(m){const log=await api("/v1/admin/audit?limit=500");
  m.innerHTML=`<div class="card"><h2>Audit log <span class="mut">(append-only · ${log.length} events)</span></h2><table><tr><th>at</th><th>actor</th><th>role</th><th>action</th><th>entity</th><th>detail</th></tr>${log.map(e=>`<tr><td class="mut">${ago(e.at)}</td><td>${esc(e.actor)}</td><td><span class="pill">${e.role}</span></td><td class="mono">${e.action}</td><td class="mono mut">${e.entity_type} ${esc(e.entity_id.slice(0,12))}</td><td class="mono mut">${esc(JSON.stringify(e.detail)).slice(0,160)}</td></tr>`).join("")}</table></div>`}
render();
</script>
</body>
</html>
