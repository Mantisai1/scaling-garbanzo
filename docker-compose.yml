services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mantis
      POSTGRES_PASSWORD: mantis
      POSTGRES_DB: mantis
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mantis"]
      interval: 3s
      timeout: 3s
      retries: 20
  platform:
    build: .
    ports: ["8080:8080"]
    environment:
      DATABASE_URL: postgresql+psycopg2://mantis:mantis@db:5432/mantis
      MANTIS_BOOTSTRAP_TOKEN: ${MANTIS_BOOTSTRAP_TOKEN:-change-me-bootstrap}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MANTIS_JUDGE_MODEL: ${MANTIS_JUDGE_MODEL:-gpt-4o-mini}
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
